version: 2

models:
  - name: stg_game_log
    description: >
      Raw game log with columns renamed and cast to proper types.
      No cleaning happens here, so duplicates and unfinished games are still present.
    columns:
      - name: game_id
        description: NBA game identifier, stored as text to keep leading zeros.
      - name: team_id
        description: NBA team identifier.
      - name: game_date
        description: Calendar date of the game.
      - name: points
        description: Points scored by the team in the game.
      - name: team_abbreviation
        description: Three-letter team code.
      - name: wl
        description: Result for the team, W or L. Null if the game is not finished.
      - name: _loaded_at
        description: Timestamp of when the row was loaded by the ingest script.

  - name: stg_teams
    description: Raw team reference data, renamed and typed. One row per team load.
    columns:
      - name: team_id
        description: NBA team identifier.
      - name: team_name
        description: Full team name.
      - name: team_abbreviation
        description: Three-letter team code.
      - name: city
        description: Team city.
      - name: _loaded_at
        description: Timestamp of when the row was loaded by the ingest script.